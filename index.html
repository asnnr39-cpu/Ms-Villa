<style>
  :root{
    --bg:#FFFFFF;
    --panel:#FFFFFF;
    --panel-2:#EAF6FC;
    --line:#BFE4F2;
    --ink:#052A3D;
    --accent:#0A6EBD;
    --accent-soft:#4FB3D9;
    --muted:#4E7A90;
    --danger:#C0392B;
    --good:#1B8A5A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{ font-family:'Cormorant Garamond', serif; font-weight:700; letter-spacing:.01em; }
  #app{ max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding-bottom:40px; position:relative; border-top:6px solid var(--accent); }

  .photo-hero{ position:relative; overflow:hidden; border-bottom:1px solid var(--line); }
  .hero-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:blur(5px) saturate(1.08) brightness(0.97); transform:scale(1.15); }
  .hero-overlay{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(255,255,255,.30) 0%, rgba(230,247,253,.80) 55%, rgba(255,255,255,.94) 100%); }
  .hero-inner{ position:relative; z-index:2; }

  .crest{ text-align:center; padding:44px 20px 26px; }
  .crest .mark{
    width:46px;height:46px;margin:0 auto 16px; border:1.5px solid var(--ink); border-radius:0;
    display:flex; align-items:center; justify-content:center; color:var(--ink);
  }
  .crest .mark svg{ width:22px; height:22px; stroke:var(--ink); fill:none; stroke-width:1.4; }
  .crest h1{ font-size:38px; font-style:italic; margin:0; color:var(--ink); }
  .crest .sub{ color:var(--muted); font-size:11px; margin-top:8px; letter-spacing:.16em; text-transform:uppercase; }
  .dots{ display:flex; gap:6px; justify-content:center; margin-top:16px; }
  .dots span{ width:5px; height:5px; border-radius:50%; background:var(--accent-soft); }
  .dots span:first-child{ background:var(--ink); }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:22px; margin:0 18px 16px; box-shadow:0 2px 10px rgba(5,42,61,.06); }
  label{ display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
  select, input[type=password], input[type=text], textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--ink);
    padding:12px 12px; border-radius:4px; font-size:15px; font-family:'Work Sans',sans-serif; margin-bottom:16px;
  }
  textarea{ resize:vertical; min-height:80px; }
  select:focus, input:focus, textarea:focus{ outline:none; border-color:var(--accent); }
  button{
    font-family:'Work Sans',sans-serif; cursor:pointer; border:none; border-radius:4px; font-size:14px; font-weight:700;
  }
  .btn-primary{ width:100%; background:var(--accent); color:#FFFFFF; padding:13px; letter-spacing:.02em; font-weight:700; }
  .btn-primary:active{ background:#08588F; }
  .btn-ghost{ width:100%; background:transparent; color:var(--muted); border:1px solid var(--line); padding:11px; margin-top:10px; font-weight:700; }
  .btn-line{ background:transparent; color:var(--accent); border:1.5px solid var(--accent); padding:9px 14px; font-size:13px; font-weight:700; }
  .error{ color:var(--danger); font-size:13px; margin:-8px 0 14px; }
  .msg{ color:var(--good); font-size:13px; margin:-8px 0 14px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:18px 18px 8px; }
  .topbar .back{ color:var(--ink); font-size:14px; display:flex; align-items:center; gap:6px; }
  .topbar .who{ font-size:12px; color:var(--muted); text-align:right; }
  .topbar .who b{ color:var(--ink); font-weight:500; }

  .house-title{ text-align:center; padding:6px 18px 20px; }
  .house-title h1{ font-size:32px; font-style:italic; margin:0 0 4px; }
  .house-title .sub{ color:var(--muted); font-size:11px; letter-spacing:.14em; text-transform:uppercase; }

  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 18px; }
  .room-tile{
    background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:22px 14px;
    display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;
    box-shadow:0 2px 8px rgba(5,42,61,.05);
  }
  .room-tile svg{ width:26px; height:26px; stroke:var(--ink); }
  .room-tile .name{ font-size:14px; color:var(--ink); }
  .room-tile .count{ font-size:11px; color:var(--muted); }

  .quick-tile{
    background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:18px 12px;
    display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; cursor:pointer;
    box-shadow:0 2px 8px rgba(5,42,61,.05);
  }
  .quick-tile svg{ width:22px; height:22px; stroke:var(--ink); }
  .quick-tile .name{ font-size:13px; color:var(--ink); }

  .duty-strip{ margin:16px 18px 4px; background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:4px; padding:14px 16px; }
  .duty-strip .lbl{ font-size:11px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; font-weight:700; }
  .duty-strip .name{ font-size:20px; font-style:italic; font-family:'Cormorant Garamond',serif; margin-top:2px; font-weight:700; }
  .duty-strip .sub2{ font-size:11px; color:var(--muted); margin-top:8px; }

  .dues-card{ text-align:left; border-left:3px solid var(--accent); }
  .dues-top{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .dues-label{ font-size:11px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; font-weight:700; }
  .dues-amount{ font-family:'Cormorant Garamond',serif; font-weight:700; font-size:34px; color:var(--accent); margin:6px 0 2px; }
  .dues-note{ font-size:12.5px; color:var(--muted); font-weight:600; }

  .nav-row{ display:flex; gap:10px; padding:6px 18px 18px; }
  .nav-row button{ flex:1; }

  .section-title{ padding:0 18px; margin:22px 0 10px; font-size:12px; color:var(--muted); letter-spacing:.12em; text-transform:uppercase; }

  .member-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); }
  .member-row:last-child{ border-bottom:none; }
  .member-row .name{ font-size:14px; }
  .member-row .tag{ font-size:11px; color:var(--muted); }
  .avatar{ width:38px; height:38px; border-radius:50%; object-fit:cover; border:1px solid var(--accent-soft); }
  .avatar-empty{ width:38px; height:38px; border-radius:50%; background:var(--panel-2); border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted); }
  .left{ display:flex; align-items:center; gap:12px; }
  .status-pill{ font-size:11px; padding:4px 10px; border-radius:20px; font-weight:700; }
  .status-present{ background:rgba(27,138,90,.12); color:var(--good); }
  .status-pending{ background:rgba(78,122,144,.15); color:var(--muted); }
  .status-open{ background:rgba(10,110,189,.12); color:var(--accent); }
  .status-closed{ background:rgba(27,138,90,.12); color:var(--good); }
  .cam-btn{ background:var(--panel-2); border:1px solid var(--line); color:var(--ink); padding:7px 10px; font-size:12px; border-radius:4px; }

  .instr-list{ padding:0 18px 18px; }
  .instr-list ol{ padding-left:20px; margin:0; }
  .instr-list li{ margin-bottom:14px; font-size:14px; line-height:1.5; color:#0B3550; }
  .instr-note{ margin:0 18px 18px; padding:14px 16px; border:1px solid var(--line); border-radius:4px; font-size:13px; color:var(--accent); text-align:center; background:var(--panel); }

  .fab-add{ margin:0 18px 18px; }

  .modal-bg{ position:fixed; inset:0; background:rgba(5,42,61,.45); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  .modal{ background:var(--panel); border:1px solid var(--line); border-radius:10px 10px 0 0; padding:22px 18px 26px; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; }
  .modal h3{ margin:0 0 14px; font-size:20px; font-style:italic; }
  .chip-select{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .chip{ padding:8px 12px; border:1px solid var(--line); border-radius:20px; font-size:13px; color:var(--muted); cursor:pointer; }
  .chip.on{ border-color:var(--ink); color:var(--ink); background:var(--panel-2); }

  .foot-note{ text-align:center; color:var(--muted); font-size:11px; padding:10px 18px 0; }
  input[type=file]{ display:none; }

  .info-block{ margin:0 18px 16px; padding:16px 18px; background:var(--panel); border:1px solid var(--line); border-radius:6px; }
  .info-block .lbl{ font-size:11px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px; }

  .weekday-row{ display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--line); }
  .weekday-row:last-child{ border-bottom:none; }
  .weekday-row .day{ font-size:13px; color:var(--muted); width:90px; }
  .weekday-row.today{ color:var(--ink); }
  .weekday-row .who{ font-size:14px; text-align:right; flex:1; }
  .weekday-row.today .who{ color:var(--ink); font-family:'Cormorant Garamond',serif; font-style:italic; font-size:16px; }

  .pay-btn-row{ display:flex; gap:10px; padding:0 18px 6px; flex-wrap:wrap; }
  .pay-app-btn{ flex:1; min-width:100px; background:var(--panel); border:1px solid var(--line); color:var(--ink); padding:14px 8px; border-radius:6px; text-align:center; font-size:12px; text-decoration:none; display:block; box-shadow:0 2px 8px rgba(5,42,61,.05); }
  .pay-app-btn b{ display:block; font-size:14px; margin-bottom:2px; color:var(--ink); font-style:italic; font-family:'Cormorant Garamond',serif; }
  .upi-box{ margin:0 18px 16px; padding:16px 18px; background:var(--panel-2); border:1px dashed var(--accent-soft); border-radius:6px; font-size:13px; text-align:center; }
  .upi-box .id{ color:var(--ink); font-family:'Cormorant Garamond',serif; font-style:italic; font-size:18px; margin-top:4px; word-break:break-all; }

  .ledger-table{ width:100%; border-collapse:collapse; font-size:13px; }
  .ledger-table th{ text-align:left; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; padding:0 6px 8px; border-bottom:1px solid var(--line); }
  .ledger-table td{ padding:9px 6px; border-bottom:1px solid var(--line); color:#0B3550; }
  .ledger-table td.num{ text-align:right; font-family:'Work Sans',sans-serif; }
  .ledger-table tr:last-child td{ border-bottom:none; }
  .ledger-total{ display:flex; justify-content:space-between; padding:14px 18px; font-size:14px; border-top:1px solid var(--line); margin-top:4px; }
  .ledger-total b{ font-family:'Cormorant Garamond',serif; font-style:italic; font-size:17px; }

  .complaint-card{ background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:14px 16px; margin:0 18px 12px; box-shadow:0 2px 8px rgba(5,42,61,.05); }
  .complaint-card .top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .complaint-card .cat{ font-size:14px; color:var(--ink); font-weight:500; }
  .complaint-card .desc{ font-size:13px; color:#2C5870; margin-top:6px; line-height:1.4; }
  .complaint-card .meta{ font-size:11px; color:var(--muted); margin-top:8px; }
</style>
</head>

const HAS_CLAUDE_STORAGE = !!(window.storage && window.storage.set && window.storage.get);

async function sset(key, value){
  try{
    if(HAS_CLAUDE_STORAGE){ await window.storage.set(key, JSON.stringify(value), true); }
    else { localStorage.setItem(key, JSON.stringify(value)); }
  }catch(e){ console.error(e); }
}
async function sget(key){
  try{
    if(HAS_CLAUDE_STORAGE){ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; }
    else { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
  }catch(e){ return null; }
}

async function loadCore(){
  let members = await sget("ms-villa:members");
  if(!members){ members = DEFAULT_MEMBERS.map(m=>({...m, password:DEFAULT_PASSWORD})); await sset("ms-villa:members", members); }
  let rooms = await sget("ms-villa:rooms");
  if(!rooms){ rooms = DEFAULT_ROOMS; await sset("ms-villa:rooms", rooms); }
  let vesselOverrides = await sget("ms-villa:vessel-overrides") || {};
  let complaints = await sget("ms-villa:complaints") || [];

  let cookingStaff = await sget("ms-villa:cooking-staff");
  if(!cookingStaff){ cookingStaff = [...DEFAULT_COOKING_STAFF]; await sset("ms-villa:cooking-staff", cookingStaff); }
  let waterDuty = await sget("ms-villa:water-duty");
  if(!waterDuty){ waterDuty = DEFAULT_WATER_CAN_DUTY; await sset("ms-villa:water-duty", waterDuty); }
  let weeklyVesselDuty = await sget("ms-villa:vessel-weekly");
  if(!weeklyVesselDuty){ weeklyVesselDuty = {...DEFAULT_WEEKLY_VESSEL_DUTY}; await sset("ms-villa:vessel-weekly", weeklyVesselDuty); }

  state.members = members;
  state.rooms = rooms;
  state.vesselOverrides = vesselOverrides;
  state.complaints = complaints;
  state.cookingStaff = cookingStaff;
  state.waterDuty = waterDuty;
  state.weeklyVesselDuty = weeklyVesselDuty;
}

  if(state.view==="home") return renderHome();
  if(state.view==="room") return renderRoom();
  if(state.view==="instructions") return renderInstructions();
  if(state.view==="settings") return renderSettings();
  if(state.view==="changepass") return renderChangePass();
  if(state.view==="duty") return renderDuty();
  if(state.view==="expenses") return renderExpenses();
  if(state.view==="rent") return renderRent();
  if(state.view==="complaints") return renderComplaints();
}

function renderLogin(){
  const options = state.members.map(m=>`<option value="${m.username}">${m.username}</option>`).join("");
  const standaloneNote = HAS_CLAUDE_STORAGE ? "" : `<div class="instr-note" style="margin:0 18px 18px;">Running in standalone mode: data is saved only on this device/browser, not shared across everyone's phones.</div>`;
  app.innerHTML = `
    ${heroWrap("living", `
      <div class="crest">
        <div class="mark">${HOUSE_ICON}</div>
        <h1>Ms Villa</h1>
        <div class="sub">Resident Portal</div>
        <div class="dots"><span></span><span></span><span></span><span></span><span></span></div>
      </div>
    `)}
    ${standaloneNote}
    <div class="card">
      <label>Select your username</label>
      <select id="login-user">${options}</select>
      <label>Password</label>
      <input type="password" id="login-pass" placeholder="Enter password">
      <div class="error" id="login-error" style="display:none;"></div>
      <button class="btn-primary" id="login-btn">Sign In</button>
    </div>
    <div class="foot-note">First time signing in? Your password is <b style="color:var(--accent)">Msvilla@202</b> — change it after logging in.</div>
    <div class="foot-note" style="margin-top:6px;">On iPhone: open this page in Safari, tap Share, then "Add to Home Screen" for an app-like icon.</div>
  `;
  $("#login-btn").onclick = ()=>{
    const u = $("#login-user").value;
    const p = $("#login-pass").value;
    const member = state.members.find(m=>m.username===u);
    if(member && member.password===p){
      state.session = { username: u };
      state.view = "home";
      render();
    } else {
      const err = $("#login-error");
      err.style.display = "block";
      err.textContent = "Incorrect password. Please try again.";
    }
  };
}

function topbar(title, backView){
  const me = state.members.find(m=>m.username===state.session.username);
  return `
    <div class="topbar">
      <div class="back" data-nav="${backView}" style="cursor:pointer;">${backView? "&larr; Back" : ""}</div>
      <div class="who">Signed in as<br><b>${me.name}</b></div>
    </div>
  `;
}

function renderHome(){
  const duty = vesselDutyFor(todayKey());
  const dutyName = duty ? nameFor(duty, state.members) : "Unassigned";
  const tiles = state.rooms.map(r=>`
    <div class="room-tile" data-room="${r.id}" style="cursor:pointer;">
      ${ICONS[r.id]||""}
      <div class="name">${r.name}</div>
      <div class="count">${r.assigned.length} assigned</div>
    </div>
  `).join("");
  const quickLinks = [
    {id:"duty", name:"Duty Schedule"},
    {id:"expenses", name:"Room Expenses"},
    {id:"rent", name:"Rent & Pay"},
    {id:"complaints", name:"Complaints"}
  ];
  const quickTiles = quickLinks.map(q=>`
    <div class="quick-tile" data-nav2="${q.id}">${ICONS[q.id]}<div class="name">${q.name}</div></div>
  `).join("");

  const myRow = ledgerRowFor(state.session.username);
  let duesBlock;
  if(myRow){
    const balance = myRow.due - myRow.paid;
    const isDue = balance > 0;
    const isCredit = balance < 0;
    const pillClass = isDue ? "status-open" : "status-closed";
    const pillText = isDue ? "Due" : (isCredit ? "Credit" : "Completed");
    const amountText = isDue ? inr(balance) : (isCredit ? inr(Math.abs(balance)) : inr(0));
    duesBlock = `
      <div class="card dues-card">
        <div class="dues-top">
          <div class="dues-label">${LEDGER.month} Rent — ${myRow.name}</div>
          <span class="status-pill ${pillClass}">${pillText}</span>
        </div>
        <div class="dues-amount">${amountText}</div>
        <div class="dues-note">${myRow.status}</div>
        <button class="btn-primary" data-nav2="rent" style="margin-top:12px;">Pay Now</button>
      </div>
    `;
  } else {
    duesBlock = `
      <div class="card dues-card">
        <div class="dues-label">${LEDGER.month} Rent</div>
        <div class="dues-note" style="margin-top:6px;">No ledger entry found under your name yet — check with the admin.</div>
      </div>
    `;
  }

  app.innerHTML = `
    ${topbar("Ms Villa", null)}
    ${heroWrap("kitchen", `
      <div class="house-title">
        <h1>Ms Villa</h1>
        <div class="sub">Household Duties &amp; Attendance</div>
      </div>
    `)}
    <div class="duty-strip">
      <div class="lbl">Today's Vessel Cleaning Duty</div>
      <div class="name">${dutyName}</div>
      <div class="sub2">Cooking: ${state.cookingStaff.join(" & ")} · Water can: ${nameFor(state.waterDuty, state.members)}</div>
    </div>
    <div class="section-title">Payment Dues</div>
    ${duesBlock}
    <div class="section-title">Rooms</div>
    <div class="grid">${tiles}</div>
    <div class="section-title">Quick Links</div>
    <div class="grid">${quickTiles}</div>
    <div class="nav-row" style="margin-top:8px;">
      <button class="btn-line" data-nav2="instructions">House Rules</button>
      <button class="btn-line" data-nav2="settings">Settings</button>
    </div>
  `;
  app.querySelectorAll("[data-room]").forEach(el=>{
    el.onclick = ()=>{ state.roomId = el.getAttribute("data-room"); state.view="room"; render(); };
  });
  const nav2 = app.querySelectorAll("[data-nav2]");
  nav2.forEach(el=> el.onclick = ()=>{ state.view = el.getAttribute("data-nav2"); render(); });
}

async function renderRoom(){
  const room = state.rooms.find(r=>r.id===state.roomId);
  const date = todayKey();
  state.attendance[state.roomId] = await loadAttendance(state.roomId, date);
  const att = state.attendance[state.roomId];

  const rows = room.assigned.map(username=>{
    const m = state.members.find(x=>x.username===username) || {name:username};
    const rec = att[username];
    const present = rec && rec.present;
    const photo = rec && rec.photo;
    return `
      <div class="member-row">
        <div class="left">
          ${photo ? `<img class="avatar" src="${photo}">` : `<div class="avatar-empty">${(m.name||"?")[0]}</div>`}
          <div>
            <div class="name">${m.name}</div>
            <span class="status-pill ${present?'status-present':'status-pending'}">${present? 'Present · marked' : 'Not marked yet'}</span>
          </div>
        </div>
        <div>
          <input type="file" accept="image/*" capture="environment" id="file-${username}">
          <button class="cam-btn" data-mark="${username}">${present? 'Update' : 'Mark'}</button>
        </div>
      </div>
    `;
  }).join("") || `<div class="foot-note" style="padding:20px 0;">No one assigned to this room yet. Add members from the button below.</div>`;

  app.innerHTML = `
    ${topbar(room.name,"home")}
    ${heroWrap(imageForRoom(room.id), `
      <div class="house-title" style="padding-top:0;">
        <h1 style="font-size:26px;">${room.name}</h1>
        <div class="sub">${date}</div>
      </div>
    `)}
    <div class="info-block"><div class="lbl">About this room</div>${ROOM_NOTES[room.id]||""}</div>
    <div class="section-title">Assigned Members</div>
    <div class="card" style="padding:6px 18px;">
      ${rows}
    </div>
    <div class="nav-row">
      <button class="btn-line" id="edit-assign">Edit Assignment</button>
    </div>
  `;

  room.assigned.forEach(username=>{
    const btn = app.querySelector(`[data-mark="${username}"]`);
    const file = app.querySelector(`#file-${username}`);
    btn.onclick = ()=> file.click();
    file.onchange = async ()=>{
      const f = file.files[0];
      if(!f) return;
      const reader = new FileReader();
      reader.onload = async ()=>{
        att[username] = { present:true, photo: reader.result, time: new Date().toISOString() };
        await saveAttendance(state.roomId, date, att);
        renderRoom();
      };
      reader.readAsDataURL(f);
    };
  });

  $("#edit-assign").onclick = ()=> openAssignModal(room);
}

function openAssignModal(room){
  const chips = state.members.map(m=>{
    const on = room.assigned.includes(m.username);
    return `<div class="chip ${on?'on':''}" data-chip="${m.username}">${m.name}</div>`;
  }).join("");
  const wrap = document.createElement("div");
  wrap.className = "modal-bg";
  wrap.innerHTML = `
    <div class="modal">
      <h3>Assign — ${room.name}</h3>
      <div class="chip-select">${chips}</div>
      <button class="btn-primary" id="save-assign">Save</button>
      <button class="btn-ghost" id="cancel-assign">Cancel</button>
    </div>
  `;
  document.body.appendChild(wrap);
  let selected = new Set(room.assigned);
  wrap.querySelectorAll("[data-chip]").forEach(chip=>{
    chip.onclick = ()=>{
      const u = chip.getAttribute("data-chip");
      if(selected.has(u)){ selected.delete(u); chip.classList.remove("on"); }
      else { selected.add(u); chip.classList.add("on"); }
    };
  });
  wrap.querySelector("#cancel-assign").onclick = ()=> wrap.remove();
  wrap.querySelector("#save-assign").onclick = async ()=>{
    room.assigned = Array.from(selected);
    await sset("ms-villa:rooms", state.rooms);
    wrap.remove();
    renderRoom();
  };
}

function renderComplaints(){
  const me = state.members.find(m=>m.username===state.session.username);
  const mine = state.complaints.slice().reverse();
  const rows = mine.map(c=>`
    <div class="complaint-card">
      <div class="top">
        <div class="cat">${c.category}</div>
        <span class="status-pill ${c.status==='closed'?'status-closed':'status-open'}">${c.status==='closed'?'Resolved':'Open'}</span>
      </div>
      <div class="desc">${c.description}</div>
      <div class="meta">${nameFor(c.username, state.members)} · ${new Date(c.createdAt).toLocaleDateString()} ${c.status!=='closed' && me.admin ? `<span data-close="${c.id}" style="color:var(--accent); cursor:pointer; margin-left:8px;">Mark resolved</span>` : ""}</div>
    </div>
  `).join("") || `<div class="foot-note" style="padding:20px 0;">No complaints raised yet.</div>`;

  app.innerHTML = `
    ${topbar("Complaints","home")}
    ${heroWrap("bedroomB", `
      <div class="house-title" style="padding-top:0;">
        <h1 style="font-size:26px;">Raise a Complaint</h1>
        <div class="sub">Maintenance &amp; Issues</div>
      </div>
    `)}
    <div class="nav-row"><button class="btn-primary" id="new-complaint">+ New Complaint</button></div>
    <div class="section-title">All Complaints</div>
    ${rows}
  `;
  $("#new-complaint").onclick = ()=> openComplaintModal();
  app.querySelectorAll("[data-close]").forEach(el=>{
    el.onclick = async ()=>{
      const id = el.getAttribute("data-close");
      const c = state.complaints.find(x=>x.id===id);
      if(c){ c.status="closed"; await sset("ms-villa:complaints", state.complaints); renderComplaints(); }
    };
  });
}

function openComplaintModal(){
  const cats = COMPLAINT_CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join("");
  const wrap = document.createElement("div");
  wrap.className = "modal-bg";
  wrap.innerHTML = `
    <div class="modal">
      <h3>New Complaint</h3>
      <label>Category</label>
      <select id="c-cat">${cats}</select>
      <label>Describe the issue</label>
      <textarea id="c-desc" placeholder="e.g. Washing machine drum not spinning, making loud noise"></textarea>
      <div class="error" id="c-err" style="display:none;"></div>
      <button class="btn-primary" id="c-save">Submit Complaint</button>
      <button class="btn-ghost" id="c-cancel">Cancel</button>
    </div>
  `;
  document.body.appendChild(wrap);
  wrap.querySelector("#c-cancel").onclick = ()=> wrap.remove();
  wrap.querySelector("#c-save").onclick = async ()=>{
    const desc = wrap.querySelector("#c-desc").value.trim();
    const err = wrap.querySelector("#c-err");
    if(!desc){ err.style.display="block"; err.textContent="Please describe the issue."; return; }
    const complaint = {
      id: "c" + Date.now(),
      username: state.session.username,
      category: wrap.querySelector("#c-cat").value,
      description: desc,
      status: "open",
      createdAt: new Date().toISOString()
    };
    state.complaints.push(complaint);
    await sset("ms-villa:complaints", state.complaints);
    wrap.remove();
    renderComplaints();
  };
}

function openAddMemberModal(){
  const wrap = document.createElement("div");
  wrap.className = "modal-bg";
  wrap.innerHTML = `
    <div class="modal">
      <h3>Add Member</h3>
      <label>Full name</label>
      <input type="text" id="new-name" placeholder="e.g. Suresh">
      <label>Username (as they'll log in with)</label>
      <input type="text" id="new-username" placeholder="e.g. Suresh@10">
      <div class="error" id="add-error" style="display:none;"></div>
      <button class="btn-primary" id="save-member">Add — default password Msvilla@202</button>
      <button class="btn-ghost" id="cancel-member">Cancel</button>
    </div>
  `;
  document.body.appendChild(wrap);
  wrap.querySelector("#cancel-member").onclick = ()=> wrap.remove();
  wrap.querySelector("#save-member").onclick = async ()=>{
    const name = wrap.querySelector("#new-name").value.trim();
    const username = wrap.querySelector("#new-username").value.trim();
    const err = wrap.querySelector("#add-error");
    if(!name || !username){ err.style.display="block"; err.textContent="Please fill in both fields."; return; }
    if(state.members.some(m=>m.username===username)){ err.style.display="block"; err.textContent="That username already exists."; return; }
    if(state.members.length>=15){ err.style.display="block"; err.textContent="Ms Villa is limited to 15 members."; return; }
    state.members.push({ username, name, password: DEFAULT_PASSWORD });
    await sset("ms-villa:members", state.members);
    wrap.remove();
    renderSettings();
  };
}

function openEditDutyModal(){
  const dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const memberOptions = (selected) => state.members.map(m=>
    `<option value="${m.username}" ${m.username===selected?'selected':''}>${m.name}</option>`
  ).join("");
  const dayRows = dayNames.map((dn,i)=>`
    <label>${dn}</label>
    <select class="vessel-day" data-day="${i}">${memberOptions(state.weeklyVesselDuty[i])}</select>
  `).join("");

  const wrap = document.createElement("div");
  wrap.className = "modal-bg";
  wrap.innerHTML = `
    <div class="modal">
      <h3>Edit Duty Assignments</h3>
      <label>Cooking Staff (comma separated)</label>
      <input type="text" id="d-cooking" value="${state.cookingStaff.join(", ")}">
      <label>Water Can Refill</label>
      <select id="d-water">${memberOptions(state.waterDuty)}</select>
      <div class="section-title" style="margin:14px 0 6px;">Weekly Vessel Cleaning Duty</div>
      ${dayRows}
      <div class="error" id="d-err" style="display:none;"></div>
      <button class="btn-primary" id="d-save" style="margin-top:14px;">Save Changes</button>
      <button class="btn-ghost" id="d-cancel">Cancel</button>
    </div>
  `;
  document.body.appendChild(wrap);
  wrap.querySelector("#d-cancel").onclick = ()=> wrap.remove();
  wrap.querySelector("#d-save").onclick = async ()=>{
    const cookingRaw = wrap.querySelector("#d-cooking").value.trim();
    const err = wrap.querySelector("#d-err");
    if(!cookingRaw){ err.style.display="block"; err.textContent="Please enter at least one cooking staff name."; return; }

    const newCooking = cookingRaw.split(",").map(s=>s.trim()).filter(Boolean);
    const newWater = wrap.querySelector("#d-water").value;
    const newWeekly = {};
    wrap.querySelectorAll(".vessel-day").forEach(sel=>{
      newWeekly[parseInt(sel.getAttribute("data-day"),10)] = sel.value;
    });

    state.cookingStaff = newCooking;
    state.waterDuty = newWater;
    state.weeklyVesselDuty = newWeekly;

    await sset("ms-villa:cooking-staff", state.cookingStaff);
    await sset("ms-villa:water-duty", state.waterDuty);
    await sset("ms-villa:vessel-weekly", state.weeklyVesselDuty);

    wrap.remove();
    renderDuty();
  };
}

      <input type="password" id="cur-pass">
      <label>New password</label>
      <input type="password" id="new-pass">
      <label>Confirm new password</label>
      <input type="password" id="confirm-pass">
      <div class="error" id="cp-error" style="display:none;"></div>
      <div class="msg" id="cp-msg" style="display:none;"></div>
      <button class="btn-primary" id="save-pass">Save New Password</button>
    </div>
  `;
  $("#save-pass").onclick = async ()=>{
    const me = state.members.find(m=>m.username===state.session.username);
    const cur = $("#cur-pass").value, np = $("#new-pass").value, cf = $("#confirm-pass").value;
    const err = $("#cp-error"), msg = $("#cp-msg");
    err.style.display="none"; msg.style.display="none";
    if(me.password !== cur){ err.style.display="block"; err.textContent="Current password is incorrect."; return; }
    if(np.length < 6){ err.style.display="block"; err.textContent="New password should be at least 6 characters."; return; }
    if(np !== cf){ err.style.display="block"; err.textContent="New passwords do not match."; return; }
    me.password = np;
    await sset("ms-villa:members", state.members);
    msg.style.display="block"; msg.textContent="Password updated.";
  };
}

// generic back-nav delegation
document.addEventListener("click", (e)=>{
  const t = e.target.closest("[data-nav]");
  if(t && t.getAttribute("data-nav")){
    const target = t.getAttribute("data-nav");
    if(target==="home"){ state.view="home"; render(); }
    if(target==="settings"){ state.view="settings"; render(); }
  }
});

(async function init(){
  await loadCore();
  render();
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

</script>
